name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "build-tools: $BT"
          KS="$RUNNER_TEMP/release.jks"
          keytool -genkeypair -keystore "$KS" -alias app -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android \
            -dname "CN=ClearWeb, O=ClearWeb, C=CN"
          UNSIGNED="$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -n 1)"
          echo "unsigned: $UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
            --out ClearWeb-v1.0.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs ClearWeb-v1.0.apk
          sha256sum ClearWeb-v1.0.apk | tee apk-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearWeb-apk
          path: |
            ClearWeb-v1.0.apk
            apk-sha256.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0 > /dev/null 2>&1; then
            gh release upload v1.0 ClearWeb-v1.0.apk apk-sha256.txt --clobber
          else
            gh release create v1.0 ClearWeb-v1.0.apk apk-sha256.txt \
              --title "ClearWeb v1.0" \
              --notes "自动构建的 APK，见下方 Assets。"
          fi
