name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_TAG: 'v1.1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "build-tools: $BT"
          KS="$RUNNER_TEMP/release.jks"

          if [ -n "${KS_B64:-}" ]; then
            echo "使用仓库 Secrets 里的固定密钥签名（可覆盖升级）"
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            SP="${KS_PASS:?missing KEYSTORE_PASSWORD}"
            KP="${KEY_PASS:-$SP}"
            AL="${KEY_ALIAS:-app}"
          else
            echo "::warning::未配置 KEYSTORE_BASE64，本次用临时密钥，覆盖安装会冲突"
            keytool -genkeypair -keystore "$KS" -alias app -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android \
              -dname "CN=ClearWeb, O=ClearWeb, C=CN"
            SP=android; KP=android; AL=app
          fi

          UNSIGNED="$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -n 1)"
          echo "unsigned: $UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$AL" \
            --ks-pass "pass:$SP" --key-pass "pass:$KP" \
            --out "ClearWeb-${VERSION_TAG}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "ClearWeb-${VERSION_TAG}.apk"
          sha256sum "ClearWeb-${VERSION_TAG}.apk" | tee apk-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearWeb-apk
          path: |
            ClearWeb-${{ env.VERSION_TAG }}.apk
            apk-sha256.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" > /dev/null 2>&1; then
            gh release upload "$VERSION_TAG" "ClearWeb-${VERSION_TAG}.apk" apk-sha256.txt --clobber
          else
            gh release create "$VERSION_TAG" "ClearWeb-${VERSION_TAG}.apk" apk-sha256.txt \
              --title "ClearWeb ${VERSION_TAG}" \
              --notes "自动构建。拦截播放器预播广告接口 /_xa/ads；使用固定签名密钥，可直接覆盖升级。"
          fi
