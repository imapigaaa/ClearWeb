plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clearweb.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.clearweb.app"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            // 关闭 R8：WebView 注入脚本和反射较少，保持可预测性，避免意外裁剪
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
